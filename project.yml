# XcodeGen project definition. CI runs `xcodegen generate`; the .xcodeproj is never committed.
# DEVELOPMENT_TEAM and PRODUCT_BUNDLE_IDENTIFIER are injected on the xcodebuild command line
# from the repo variables TEAM_ID and BUNDLE_ID (ci/archive.sh), so nothing personal lives here.
name: RoguePocket
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  RoguePocket:
    type: application
    platform: iOS
    sources:
      - path: RoguePocket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.REPLACE.roguepocket   # placeholder; CI overrides from vars.BUNDLE_ID
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.1"                      # x-release-please-version
        CURRENT_PROJECT_VERSION: "1"                          # CI overrides with the run number
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"                         # iPhone and iPad
        SWIFT_VERSION: "5.0"
        # libmgba (static, arm64) and its headers come from ci/build_mgba.sh, which fills Vendor/mgba-dist.
        # rp_core.c includes <mgba/flags.h> first; that header carries the compile definitions libmgba was built with.
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/mgba-dist/include"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/mgba-dist/lib"
        OTHER_LDFLAGS: "$(inherited) -lmgba"
        SWIFT_OBJC_BRIDGING_HEADER: RoguePocket/Core/RoguePocket-Bridging-Header.h
        GCC_C_LANGUAGE_STANDARD: gnu11
